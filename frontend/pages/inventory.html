<div class="page-header">
  <div>
    <h1>Inventory Monitoring</h1>
    <p>Search, filter, sort, and drill into every SKU across your network.</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-secondary" data-action="export-excel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>Export Excel</button>
  </div>
</div>

<div class="card">
  <div class="table-toolbar" id="inventoryToolbar">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" placeholder="Search SKU or product name…" data-role="search" />
    </div>
    <select data-role="category"><option value="all">All Categories</option></select>
    <select data-role="status">
      <option value="all">All Statuses</option>
      <option value="normal">Healthy</option>
      <option value="low">Low Stock</option>
      <option value="critical">Critical</option>
      <option value="overstock">Overstock</option>
      <option value="expiring">Expiring</option>
    </select>
    <select data-role="warehouse"><option value="all">All Warehouses</option></select>
    <select data-role="supplier"><option value="all">All Suppliers</option></select>
  </div>
  <div id="inventoryTableContainer"></div>
  <div class="pagination" id="inventoryPager"></div>
</div>
