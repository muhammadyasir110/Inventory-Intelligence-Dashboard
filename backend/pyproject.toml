# Lint configuration (ruff). The research engine (eidsf/, experiments/) is
# frozen to the manuscript's reproducibility package and is linted only for
# hard errors by the release gate.
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

[tool.ruff.lint.per-file-ignores]
"eidsf/*" = ["F401", "F841"]
"experiments/*" = ["F401", "F841"]
"generate_system_pdf.py" = ["F401"]
"tests/_testenv.py" = ["F401"]
"migrations/env.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long research-engine verification tests (run by default and by the release gate; skip with -m \"not slow\")"]
# No blanket suppression: warnings are shown and fixed at the source. Only
# warnings raised inside third-party packages we cannot change are listed here.
filterwarnings = [
    "default",
    "ignore:ast.NameConstant is deprecated:DeprecationWarning:reportlab",
]
