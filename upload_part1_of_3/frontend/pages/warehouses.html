<div class="page-header">
  <div>
    <h1>Warehouse Utilization</h1>
    <p>Distribution of stock units and value across warehouse locations.</p>
  </div>
</div>

<div class="two-col">
  <div class="card">
    <div class="card-header"><div><h3>Utilization by Warehouse</h3><div class="subtitle">Relative to the busiest location</div></div></div>
    <div id="warehouseUtilList"></div>
  </div>
  <div class="card">
    <div class="card-header"><div><h3>Stock Value by Warehouse</h3></div></div>
    <div style="height:300px"><canvas id="chartWarehouseValue"></canvas></div>
  </div>
</div>

<div class="card">
  <div class="card-header"><div><h3>Warehouse Detail</h3></div></div>
  <div class="table-wrap">
    <table class="data-table">
      <thead><tr><th>Warehouse</th><th>SKU Count</th><th>Total Units</th><th>Stock Value</th><th>Utilization</th></tr></thead>
      <tbody id="warehouseTableBody"></tbody>
    </table>
  </div>
</div>
